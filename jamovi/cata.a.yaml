---
name: cata
title: Analysis of CATA data
menuGroup: SEDA

menuSubgroup: Fixed List of Attributes
menuTitle: Analysis of CATA Data
menuSubtitle: 'FactoMineR::CA + HCPC'
version: '1.1.0'
jas: '1.2'

options:
  - name: data
    type: Data

  - name: stimuli
    title: Stimulus Effect
    type: Variable
    suggested:
      - nominal
      - ordinal
    permitted:
      - factor

  - name: group
    title: CATA
    type: Variables
    suggested:
      - continuous
    permitted:
      - numeric

  - name: tuto
    title: Read me before running
    type: Bool
    default: true

  - name: showCode
    title: R code
    type: Bool
    default: false

  - name: thres
    title: Significance threshold (%)
    type: Number
    default: 5

  - name: abs
    title: X-axis
    type: Integer
    default: 1

  - name: ord
    title: Y-axis
    type: Integer
    default: 2

  - name: ncp
    title: Number of dimensions for clustering
    type: Integer
    default: 5

  - name: nbclust
    title: Number of clusters
    type: Integer
    default: -1
...
