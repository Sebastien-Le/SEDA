name: JAR
title: Analysis of JAR data
jrs: '1.1'
refs:
- jar
- sensominer
- senso
items:
- name: instructions
  title: Instructions
  visible: (tuto)
  type: Html
- name: step1Guide
  title: ''
  type: Html
- name: step1Coding
  title: JAR Coding Used for the Classical Penalty Analysis
  type: Table
  clearWith:
  - sensoatt
  - jarmod
  - lowPattern
  - highPattern
  columns:
  - name: attribute
    title: Attribute
    type: text
    combineBelow: true
  - name: level
    title: Original level
    type: text
  - name: group
    title: Group used
    type: text
- name: step2Guide
  title: ''
  type: Html
- name: step2Distribution
  title: Distribution of JAR Responses by Product and Attribute
  type: Table
  clearWith:
  - prodeff
  - sensoatt
  - jarmod
  - lowPattern
  - highPattern
  columns:
  - name: product
    title: Product
    type: text
    combineBelow: true
  - name: attribute
    title: Attribute
    type: text
  - name: below
    title: Below JAR (%)
    type: Number
    format: zto
  - name: jar
    title: JAR (%)
    type: Number
    format: zto
  - name: above
    title: Above JAR (%)
    type: Number
    format: zto
  - name: n
    title: N
    type: Integer
- name: step3Guide
  title: ''
  type: Html
- name: step3GlobalPenalty
  title: Global Multidimensional Penalties (All Products)
  type: Table
  clearWith:
  - prodeff
  - paneff
  - likvar
  - sensoatt
  - jarmod
  columns:
  - name: defect
    title: Defect
    type: text
  - name: meandrop
    title: Mean drop
    type: Number
    format: zto
  - name: stderr
    title: Std. Error
    type: Number
    format: zto
  - name: pvalue
    title: p
    format: zto,pvalue
- name: step3ProductExposure
  title: Global Defects Applied to Each Product
  type: Table
  clearWith:
  - prodeff
  - paneff
  - likvar
  - sensoatt
  - jarmod
  - consumerThreshold
  - penaltyThreshold
  columns:
  - name: product
    title: Product
    type: text
    combineBelow: true
  - name: defect
    title: Defect
    type: text
  - name: consumers
    title: Consumers (%)
    type: Number
    format: zto
  - name: meandrop
    title: Global mean drop
    type: Number
    format: zto
  - name: pvalue
    title: p
    format: zto,pvalue
  - name: priority
    title: Priority
    type: text
- name: step3GlobalPlots
  title: Global Penalty Context for Each Product
  type: Array
  clearWith:
  - prodeff
  - paneff
  - likvar
  - sensoatt
  - jarmod
  template:
    title: $key
    type: Image
    width: 600
    height: 500
    renderFun: .plotpenalty
- name: step4Guide
  title: ''
  type: Html
- name: step4Penalty
  title: Product-Specific Classical Penalty Analysis
  type: Table
  clearWith:
  - prodeff
  - paneff
  - likvar
  - sensoatt
  - jarmod
  - consumerThreshold
  - penaltyThreshold
  - lowPattern
  - highPattern
  columns:
  - name: product
    title: Product
    type: text
    combineBelow: true
  - name: attribute
    title: Attribute
    type: text
    combineBelow: true
  - name: direction
    title: Direction
    type: text
  - name: consumers
    title: Consumers (%)
    type: Number
    format: zto
  - name: meanjar
    title: Mean liking JAR
    type: Number
    format: zto
  - name: meannonjar
    title: Mean liking non-JAR
    type: Number
    format: zto
  - name: meandrop
    title: Mean drop
    type: Number
    format: zto
  - name: cilow
    title: CI 95% low
    type: Number
    format: zto
  - name: cihigh
    title: CI 95% high
    type: Number
    format: zto
  - name: pvalue
    title: p
    format: zto,pvalue
- name: step4Plots
  title: Product-Specific Penalty Plots
  type: Array
  clearWith:
  - prodeff
  - paneff
  - likvar
  - sensoatt
  - jarmod
  - consumerThreshold
  - penaltyThreshold
  - lowPattern
  - highPattern
  template:
    title: $key
    type: Image
    width: 700
    height: 520
    renderFun: .plotClassical
- name: step5Guide
  title: ''
  type: Html
- name: step5Description
  title: Description of the Products According to Defects
  type: Table
  clearWith:
  - prodeff
  - paneff
  - sensoatt
  - jarmod
  columns:
  - name: product
    title: Product
    type: text
    combineBelow: true
  - name: defect
    title: Defect
    type: text
  - name: internper
    title: Internal %
    type: Number
    format: zto
  - name: globper
    title: Global %
    type: Number
    format: zto
  - name: internfreq
    title: Internal frequency
    type: Number
    format: zto
  - name: globfreq
    title: Global frequency
    type: Number
    format: zto
  - name: pvaluedfres
    title: p
    format: zto,pvalue
  - name: vtest
    title: V-test
    type: Number
    format: zto
- name: step5Map
  title: Representation of the Products and the Defects
  type: Image
  width: 600
  height: 500
  renderFun: .plotboth
  clearWith:
  - prodeff
  - paneff
  - sensoatt
  - jarmod
- name: step5Frequency
  title: Frequency Table Used for the Correspondence Analysis
  type: Table
  clearWith:
  - prodeff
  - paneff
  - sensoatt
  - jarmod
  columns: []
- name: rCode
  title: R Code
  type: Preformatted
  visible: (showCode)
  clearWith:
  - showCode
  - prodeff
  - paneff
  - likvar
  - sensoatt
  - jarmod
  - consumerThreshold
  - penaltyThreshold
  - lowPattern
  - highPattern
