---
name:  JAR
title: Analysis of JAR data
menuGroup: SEDA
menuSubgroup: Fixed List of Attributes
menuTitle: Analysis of JAR Data
menuSubtitle: 'SensoMineR::JAR + product-specific penalties'
version: '1.1.0'
jas: '1.2'

options:
  - name: data
    type: Data

  - name: prodeff
    title: Stimulus Effect
    type: Variable
    suggested:
      - nominal
    permitted:
      - factor

  - name: paneff
    title: Subject Effect
    type: Variable
    suggested:
      - nominal
    permitted:
      - factor

  - name: likvar
    title: Liking Variable
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: sensoatt
    title: Sensory Attributes
    type: Variables
    suggested:
      - nominal
    permitted:
      - factor

  - name: tuto
    title: Read me before running
    type: Bool
    default: true

  - name: showCode
    title: R code
    type: Bool
    default: false

  - name: jarmod
    title: Coding of the JAR level
    type: String
    default: "jar"

  - name: consumerThreshold
    title: Consumer threshold (%)
    type: Number
    min: 0
    max: 100
    default: 20

  - name: penaltyThreshold
    title: Mean-drop threshold
    type: Number
    min: 0
    default: 1

  - name: lowPattern
    title: Below-JAR keywords
    type: String
    default: "too low|not enough|too weak|plain|low"

  - name: highPattern
    title: Above-JAR keywords
    type: String
    default: "too high|too much|too strong|vivid|high"
