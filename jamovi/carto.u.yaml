title: Preference Mapping
name: carto
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Stimuli Labels
        children:
          - type: VariablesListBox
            name: individus
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: X-axis
        children:
          - type: VariablesListBox
            name: coox
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Y-axis
        children:
          - type: VariablesListBox
            name: cooy
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Liking Variables
        children:
          - type: VariablesListBox
            name: hedo
            isTarget: true

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: Label
        label: Instructions and R Code
        stretchFactor: 1
        children:
          - type: Label
            label: ''
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: tuto
          - type: Label
            label: ''
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: showCode

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: Label
        label: Preference Mapping Options
        stretchFactor: 1
        children:
          - type: Label
            label: ''
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: ComboBox
                name: regtype
          - type: Label
            label: ''
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: TextBox
                name: level
                format: number

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: CollapseBox
        label: Consumer Classification
        collapsed: true
        stretchFactor: 1
        children:
          - type: CheckBox
            name: classify
          - type: TextBox
            name: nbclust
            format: number
          - type: CheckBox
            name: graphdendro
          - type: CheckBox
            name: graphgroups

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: CollapseBox
        label: Graphic Options
        collapsed: true
        stretchFactor: 1
        children:
          - type: Label
            label: Color Palette
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: colbelow
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: colabove
