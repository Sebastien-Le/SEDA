name: Sorting
title: Analysis of Sorting Data
jrs: '1.1'
refs:
- sorting
- sensominer
- senso
items:
- name: mcaCache
  title: MCA cache
  type: Preformatted
  visible: false
  clearWith:
  - actvars
  - qualisup
  - individus
  - ventil
  - ncp
  - nFactors
  - abs
  - ord

- name: classifCache
  title: Classification cache
  type: Preformatted
  visible: false
  clearWith:
  - actvars
  - qualisup
  - individus
  - ventil
  - ncp
  - nbclust

- name: instructions
  title: Instructions
  visible: (tuto)
  type: Html

- name: step1Guide
  title: ''
  type: Html

- name: dfresgroup
  title: Description of the Stimuli from Sorting Labels
  type: Group
  items:
  - name: dfres
    title: Words Associated with the Stimuli
    type: Table
    clearWith:
    - actvars
    - qualisup
    - individus
    - leveltext
    columns:
    - name: component
      title: Stimulus
      type: text
      combineBelow: true
    - name: word
      title: Word
      type: text
    - name: internper
      title: Internal %
      type: Number
      format: zto
    - name: globper
      title: Global %
      type: Number
      format: zto
    - name: internfreq
      title: Internal frequency
      type: Number
      format: zto
    - name: globfreq
      title: Global frequency
      type: Number
      format: zto
    - name: pvaluedfres
      title: p
      type: Number
      format: zto,pvalue
    - name: vtest
      title: V-test
      type: Number
      format: zto

- name: longformatdata
  title: Long-Format Sorting Labels
  type: Preformatted
  visible: (longformat)
  clearWith:
  - actvars
  - qualisup
  - individus
  - longformat

- name: step2Guide
  title: ''
  type: Html

- name: eigengroup
  title: Eigenvalue Decomposition
  type: Group
  items:
  - name: eigen
    title: Eigenvalue and (Cumulative) Percentage of Variance
    type: Table
    clearWith:
    - actvars
    - qualisup
    - ventil
    - ncp
    - nFactors
    - abs
    - ord
    columns:
    - name: component
      title: ''
      type: text
    - name: eigenvalue
      title: Eigenvalue
      type: Number
      format: zto
    - name: purcent
      title: '% of the variance'
      type: Number
      format: zto
    - name: purcentcum
      title: Cumulative %
      type: Number
      format: zto

- name: plotindiv
  title: Representation of the Stimuli
  type: Image
  width: 800
  height: 600
  renderFun: .plotindiv
  clearWith:
  - actvars
  - qualisup
  - individus
  - ventil
  - ncp
  - nFactors
  - abs
  - ord

- name: plotvar
  title: Representation of the Subjects
  type: Image
  width: 800
  height: 600
  renderFun: .plotvar
  clearWith:
  - actvars
  - qualisup
  - individus
  - ventil
  - ncp
  - nFactors
  - abs
  - ord

- name: plotitemvar
  title: Representation of the Sorting Categories
  type: Image
  width: 800
  height: 600
  renderFun: .plotitemvar
  clearWith:
  - actvars
  - qualisup
  - individus
  - ventil
  - ncp
  - nFactors
  - abs
  - ord
  - varmodqualisup
  - varmodvar
  - modality

- name: dimdesc
  title: Automatic Description of the Dimensions
  type: Group
  items:
  - name: categorical
    title: Subjects Associated with the Dimensions
    type: Table
    clearWith:
    - actvars
    - qualisup
    - individus
    - ventil
    - nFactors
    - proba
    columns:
    - name: dimension
      title: Dimension
      type: text
      combineBelow: true
    - name: variable
      title: Subject
      type: text
    - name: r2
      title: R²
      type: Number
      format: zto
    - name: p
      title: p
      type: Number
      format: zto,pvalue
  - name: categories
    title: Sorting Categories Associated with the Dimensions
    type: Table
    clearWith:
    - actvars
    - qualisup
    - individus
    - ventil
    - nFactors
    - proba
    columns:
    - name: dimension
      title: Dimension
      type: text
      combineBelow: true
    - name: category
      title: Category
      type: text
    - name: estimate
      title: Estimate
      type: Number
      format: zto
    - name: p
      title: p
      type: Number
      format: zto,pvalue

- name: individus
  title: Stimulus Tables
  type: Group
