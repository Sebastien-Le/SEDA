    title: Contributions Table
    type: Table
    visible: (varcontrib)
    clearWith:
    - actvars
    - qualisup
    - ventil
    - nFactors
    - ncp
    columns: []
  - name: cosinus
    title: Cosine Table
    type: Table
    visible: (varcos)
    clearWith:
    - actvars
    - qualisup
    - ventil
    - nFactors
    - ncp
    columns: []

- name: step3Guide
  title: ''
  visible: (graphclassif)
  type: Html

