    - ventil
    - nFactors
    - ncp
    columns: []
  - name: cosinus
    title: Cosine Table
    type: Table
    visible: (indcos)
    clearWith:
    - actvars
    - qualisup
    - individus
    - ventil
    - nFactors
    - ncp
    columns: []

- name: variables
  title: Subject Tables
