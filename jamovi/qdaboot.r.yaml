name: QDABOOT
title: Multivariate Representation of the Stimulus Space
jrs: '1.1'
refs:
- ellipse
- sensominer
- senso
items:
- name: instructions
  title: Instructions
  visible: (tuto)
  type: Html
- name: step1Guide
  title: ''
  type: Html
- name: plotind
  title: Representation of the Stimuli
  type: Image
  clearWith:
  - prod
  - pane
  - senso
  - abs
  - ord
  - scale_unit_box
  - center_pane_box
  - scale_pane_box
  - level_search
  - nFactors
  width: 900
  height: 600
  renderFun: .plotIndaxe
- name: plotvar
  title: Representation of the Sensory Attributes
  type: Image
  clearWith:
  - prod
  - pane
  - senso
  - abs
  - ord
  - scale_unit_box
  - center_pane_box
  - scale_pane_box
  - level_search
  - nFactors
  width: 600
  height: 600
  renderFun: .plotVaraxe
- name: dimdesc
  title: Automatic Description of the Dimensions
  type: Table
  clearWith:
  - prod
  - pane
  - senso
  - level_search
  - scale_unit_box
  - center_pane_box
  - scale_pane_box
  - nFactors
  - proba
  columns:
  - name: dimension
    title: Dimension
    type: text
    combineBelow: true
  - name: variable
    title: Sensory Attribute
    type: text
  - name: correlation
    title: Correlation
    type: number
    format: zto
  - name: p
    title: p
    type: number
    format: zto,pvalue
  - name: n
    title: N
    type: integer
- name: eigenGr
  title: Eigenvalue Decomposition
  type: Group
  clearWith:
  - prod
  - pane
  - senso
  - nbsimul
  - nbpane
  - abs
  - ord
  - scale_unit_box
  - center_pane_box
  - scale_pane_box
  - level_search
  visible: false
  items:
  - name: eigen_table
    title: Eigenvalue and (Cumulative) Percentage of Variance
    type: Table
    columns:
    - name: facto
      title: ''
      type: text
    - name: eig
      title: Eigenvalue
      type: number
      format: zto
    - name: eig_pct
      title: '% of variance'
      type: number
      format: zto
    - name: eig_pct_cum
      title: Cumulative %
      type: number
      format: zto
- name: step2Guide
  title: ''
  type: Html
- name: plotspa
  title: Representation of the Stimuli with Confidence Ellipses
  type: Image
  clearWith:
  - prod
  - pane
  - senso
  - thresh
  - nbsimul
  - nbpane
  - abs
  - ord
  - scale_unit_box
  - center_pane_box
  - scale_pane_box
  - level_search
  width: 900
  height: 600
  renderFun: .plotSpace
- name: hotGr
  title: Hotelling Test
  type: Group
  clearWith:
  - prod
  - pane
  - senso
  - nbsimul
  - nbpane
  - abs
  - ord
  - scale_unit_box
  - center_pane_box
  - scale_pane_box
  - level_search
