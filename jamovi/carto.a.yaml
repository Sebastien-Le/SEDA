---
name: carto
title: Preference Mapping
menuGroup: SEDA

menuTitle: Preference Mapping
menuSubgroup: Hedonic Data
menuSubtitle: SensoMineR::carto

version: '1.1.0'
jas: '1.2'

options:
  - name: data
    type: Data

  - name: individus
    title: Individual Labels
    type: Variable
    suggested:
      - nominal
    permitted:
      - factor

  - name: coox
    title: X-axis
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: cooy
    title: Y-axis
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: hedo
    title: Liking Variables
    type: Variables
    suggested:
      - continuous
    permitted:
      - numeric

  - name: tuto
    title: Read me before running
    type: Bool
    default: true

  - name: showCode
    title: R code
    type: Bool
    default: false

  - name: regtype
    title: Regression model
    type: List
    options:
      - title: Quadratic
        name: '1'
      - title: Vector
        name: '2'
      - title: Circular
        name: '3'
      - title: Elliptical
        name: '4'
    default: '1'

  - name: level
    title: Preference threshold (SD)
    type: Number
    default: 0
    min: -3
    max: 3

  - name: colbelow
    title: Color for low preference areas
    type: List
    options:
      - name: blue
        title: Blue
      - name: red
        title: Red
      - name: green
        title: Green
      - name: orange
        title: Orange
      - name: purple
        title: Purple
      - name: brown
        title: Brown
      - name: darkgrey
        title: Dark grey
      - name: black
        title: Black
    default: blue

  - name: colabove
    title: Color for high preference areas
    type: List
    options:
      - name: red
        title: Red
      - name: blue
        title: Blue
      - name: green
        title: Green
      - name: orange
        title: Orange
      - name: purple
        title: Purple
      - name: brown
        title: Brown
      - name: darkgrey
        title: Dark grey
      - name: black
        title: Black
    default: red

  - name: classify
    title: Classification of consumers
    type: Bool
    default: false

  - name: nbclust
    title: Number of clusters
    type: Integer
    default: -1

  - name: graphdendro
    title: Cluster dendrogram
    type: Bool
    default: true

  - name: graphgroups
    title: Preference maps by cluster
    type: Bool
    default: true
...
